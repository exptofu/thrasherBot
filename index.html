<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Georgia Birding Message Helper</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@3.3.0/dist/maplibre-gl.css" crossorigin="" />
  <link rel="stylesheet" href="styles.css?v=6" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,200..900;1,8..60,200..900&display=swap" rel="stylesheet">
</head>
<body>
  <div class="journal-container">
    <div id="overviewView" class="view-panel active">
      <div class="top-row">
        <div class="journal-title">Observations</div>
      </div>

      <div id="entriesGrid" class="entries-grid"></div>
      <div id="emptyMessage" class="empty-message visible">No observations saved yet.</div>
      <div class="overview-footer">
        <div id="observationCountText" class="overview-summary">0 observations</div>
        <button type="button" id="deleteAllBtn" class="journal-btn secondary delete-all-btn" style="display: none;">Delete all</button>
      </div>
    </div>

    <div id="observationView" class="view-panel">
      <div class="wizard-header">
        <div class="journal-title">Edit Observation</div>
        <button type="button" id="exitObservationBtn" aria-label="Close observation detail" class="icon-btn"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-x preview-icon"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
        
      </div>

      <div id="locationStep" class="wizard-page active">
        <div id="gpsMap" class="gps-map" aria-label="Map showing a centered GPS pin"></div>
        <div class="gps-input-row">
          <div class="gps-field">
            <label>
              Latitude
              <input id="latitude" class="journal-input readonly-field" type="number" step="0.000001" tabindex="-1" readonly />
            </label>
          </div>

          <div class="gps-field">
            <label>
              Longitude
              <input id="longitude" class="journal-input readonly-field" type="number" step="0.000001" tabindex="-1" readonly />
            </label>
          </div>

          <button type="button" id="useLocationBtn" class="journal-btn gps-button">Use GPS</button>
        </div>

        <div id="regionSuggestions" class="suggestion-table-wrap" aria-live="polite"></div>

        <label>
          Observation time
          <input id="observationTime" class="journal-input" type="datetime-local" />
        </label>


        <div class="form-actions">
          <button type="button" id="toDetailsBtn" class="journal-btn">Next</button>
        </div>
      </div>

      <div id="detailsStep" class="wizard-page">
        

        <label>
          Species
          <input id="species" class="journal-input" type="text" required />
        </label>

        <label>
          Hotspot (optional)
          <input id="hotspot" class="journal-input" type="text" />
        </label>

        <label>
          Notes (optional)
          <textarea id="description" class="journal-textarea" rows="4"></textarea>
        </label>

        <div class="reference-bar">
          <span id="refGps">GPS: not set</span>
          <span id="refTime">Time: not set</span>
        </div>

        <div class="form-actions stacked">
          <button type="button" id="backToLocationBtn" class="journal-btn secondary">Back</button>
          <button type="button" id="saveObservationBtn" class="journal-btn">Save observation</button>
        </div>
      </div>
    </div>

    <div id="detailView" class="view-panel">
      <div class="wizard-header">
        <div class="journal-title">Observation</div>
        <div class="detail-top-actions">
          <button type="button" id="editDetailBtn" aria-label="Edit" class="mini-btn"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-pencil preview-icon"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/><path d="m15 5 4 4"/></svg></button>
          <button type="button" id="deleteDetailBtn" aria-label="Delete" class="mini-btn danger"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-trash preview-icon"><path d="M10 11v6"/><path d="M14 11v6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button>
          <button type="button" id="closeDetailBtn" aria-label="Close observation detail" class="icon-btn"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-x preview-icon"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
        </div>
      </div>

      <div id="entryDetailHeader" class="detail-header"></div>

      <div id="detailMap" class="gps-map detail-map" aria-label="Map showing the saved observation location"></div>

      <div class="journal-section-title">Discord copy/paste format</div>
      <textarea id="discordOutput" class="journal-output-box" readonly placeholder="Your saved observation will appear here."></textarea>

      <div class="form-copy">
        <button type="button" id="copyBtn" class="journal-btn">Copy to clipboard</button>
      </div>
    </div>
    <button type="button" id="floatingNewObservationBtn" class="fab" aria-label="Create new observation"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-file-plus-corner preview-icon"><path d="M11.35 22H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.706.706l3.588 3.588A2.4 2.4 0 0 1 20 8v5.35"/><path d="M14 2v5a1 1 0 0 0 1 1h5"/><path d="M14 19h6"/><path d="M17 16v6"/></svg></button>
  </div>

  <script src="https://unpkg.com/maplibre-gl@3.3.0/dist/maplibre-gl.js" crossorigin=""></script>
  <script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>
  <script src="app.js?v=20261013-map-marker-fix"></script>

</body>
</html>
