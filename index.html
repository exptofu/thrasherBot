<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Georgia Birding Message Helper</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@3.3.0/dist/maplibre-gl.css" crossorigin="" />
  <link rel="stylesheet" href="styles.css?v=6" />
</head>
<body>
  <div class="journal-container">

    <form id="birdForm">
      <div class="journal-title">Observation details</div>
      <div id="gpsMap" class="gps-map" aria-label="Map showing a centered GPS pin"></div>
      <div class="gps-input-row">
        <div class="gps-field">
          <label>
            Latitude
            <input id="latitude" class="journal-input readonly-field" type="number" step="0.000001" placeholder="" tabindex="-1" readonly />
          </label>
        </div>

        <div class="gps-field">
          <label>
            Longitude
            <input id="longitude" class="journal-input readonly-field" type="number" step="0.000001" placeholder="" tabindex="-1" readonly />
          </label>
        </div>

        <button type="button" id="useLocationBtn" class="journal-btn gps-button">Use GPS</button>
      </div>
      <div id="regionSuggestions" class="suggestion-table-wrap" aria-live="polite"></div>

      

      <label>
        Species
        <input id="species" class="journal-input" type="text" placeholder="" required />
      </label>

      <label>
        Hotspot (optional)
        <input id="hotspot" class="journal-input" type="text" placeholder="" />
      </label>

      <label>
        Notes (optional)
        <textarea id="description" class="journal-textarea" rows="4" placeholder=""></textarea>
      </label>

      
    </form>

    <div class="journal-section-title">Generated message</div>
    <textarea id="discordOutput" class="journal-output-box" readonly placeholder="Fill in the required fields..."></textarea>

    <div class="form-actions">
      <button type="button" id="copyBtn" class="journal-btn">Copy to clipboard</button>
    </div>
  </div>

  <script src="https://unpkg.com/maplibre-gl@3.3.0/dist/maplibre-gl.js" crossorigin=""></script>
  <script src="app.js"></script>
</body>
</html>
