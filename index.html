<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Georgia County Region Editor</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <h1>Georgia County Regions</h1>
        <p class="subtitle">Click a county to assign it to a region.</p>

        <div class="panel">
          <h2>Current region legend</h2>
          <ul id="regionLegend" class="legend-list"></ul>
        </div>

        <div class="actions">
          <button id="exportButton" type="button">Export JSON</button>
          <button id="resetButton" class="secondary" type="button">Reset defaults</button>
        </div>
      </aside>

      <main class="map-panel">
        <div id="mapContainer" aria-live="polite"></div>

        <div id="countyModal" class="county-modal hidden" role="dialog" aria-modal="true" aria-labelledby="countyName">
          <div class="modal-card">
            <div class="modal-header">
              <h3 id="countyName">County</h3>
              <button id="closeModal" type="button" aria-label="Close county selector">×</button>
            </div>

            <label for="regionSelect">Region</label>
            <select id="regionSelect"></select>
          </div>
        </div>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
