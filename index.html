<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>GA Bird Post Builder</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="journal-container">
    <h1 class="journal-title">Bird Post Builder</h1>

    <div class="journal-section-title">Observation details</div>

    <form id="birdForm">
      <label>
        Bird species
        <input id="species" class="journal-input" type="text" placeholder="e.g. Northern Cardinal" required />
      </label>

      <label>
        Hotspot name (optional)
        <input id="hotspot" class="journal-input" type="text" placeholder="e.g. Lake Herrick" />
      </label>

      <label>
        Brief description (optional)
        <textarea id="description" class="journal-textarea" rows="4" placeholder="What did you see? behavior, count, habitat notes, etc."></textarea>
      </label>

      <div class="journal-section-title">GPS location</div>
      <div class="gps-actions">
        <button type="button" id="useLocationBtn" class="journal-btn">Use my GPS</button>
      </div>

      <label>
        Latitude
        <input id="latitude" class="journal-input" type="number" step="0.000001" placeholder="33.955000" />
      </label>

      <label>
        Longitude
        <input id="longitude" class="journal-input" type="number" step="0.000001" placeholder="-83.382000" />
      </label>

      <div id="gpsAccuracy" class="journal-status-box">Accuracy: no location captured yet</div>
      <div class="gps-actions">
        <button type="button" id="manualCoordsBtn" class="journal-btn">Use manual coords</button>
      </div>

      <div class="journal-section-title">Suggested post regions</div>
      <label>
        Select county / post region
        <select id="countySelect" class="journal-select" aria-label="Select county or post region">
          <option value="">No county match yet</option>
        </select>
      </label>

      <div id="regionSuggestions" class="suggestion-table-wrap" aria-live="polite"></div>

      <div class="form-actions">
        <button type="button" id="generateBtn" class="journal-btn">Generate Discord message</button>
      </div>
    </form>

    <div class="journal-section-title">Generated message</div>
    <textarea id="discordOutput" class="journal-output-box" readonly placeholder="Generated Discord message will appear here..."></textarea>

    <div class="form-actions">
      <button type="button" id="copyBtn" class="journal-btn">Copy to clipboard</button>
    </div>
  </div>

    const form = {

    let latestLocation = null;

    function updateGpsStatus(text, tone = 'muted') {
      form.gpsAccuracy.textContent = text;
      const colors = {
        muted: '#475569',
        success: '#166534',
        error: '#7f1d1d'
      };
      form.gpsAccuracy.style.color = colors[tone] || colors.muted;
    }

    function selectCountyOption(county) {
      if (!county) return;
      const countyOptions = [...form.countySelect.options].map((option) => option.value).filter(Boolean);
      if (!countyOptions.includes(county)) {
        countyOptions.push(county);
      }
      form.countySelect.innerHTML = countyOptions
        .map((optionCounty) => `<option value="${optionCounty}" ${optionCounty === county ? 'selected' : ''}>${optionCounty}</option>`)
        .join('');
      form.countySelect.value = county;
      updateCountyOptions(countyOptions);
    }

    function formatCoordinate(value, axis) {
      if (value === null || value === undefined || !Number.isFinite(Number(value))) {
        return 'N/A';
      }
      const numeric = Number(value);
      return numeric.toFixed(axis === 'lat' ? 5 : 5);
    }

    async function setLocation(lat, lon, accuracy) {
      form.latitude.value = lat;
      form.longitude.value = lon;
      latestLocation = {
        lat: Number(lat),
        lon: Number(lon),
        accuracy: Number.isFinite(accuracy) ? Number(accuracy) : null
      };

      try {
        await updateSuggestedCountyMatches(latestLocation);
      } catch (error) {
        form.countySelect.innerHTML = '<option value="">No county match yet</option>';
      }

      const accuracyText = Number.isFinite(accuracy) ? `Accuracy: ±${Math.round(accuracy)}m` : 'Accuracy: manual entry';
      updateGpsStatus(accuracyText, 'success');
    }

    function useManualCoordinates() {
      const lat = Number(form.latitude.value);
      const lon = Number(form.longitude.value);
      if (!Number.isFinite(lat) || !Number.isFinite(lon)) {
        updateGpsStatus('Enter valid coordinates before generating.', 'error');
        return null;
      }
      if (lat < -90 || lat > 90 || lon < -180 || lon > 180) {
        updateGpsStatus('Coordinates are outside valid Earth ranges.', 'error');
        return null;
      }
      setLocation(lat, lon, null);
      return latestLocation;
    }

    function useMyGps() {
      if (!navigator.geolocation) {
        updateGpsStatus('This browser does not support GPS lookup.', 'error');
        return;
      }

      updateGpsStatus('Requesting high-accuracy GPS…', 'muted');
      navigator.geolocation.getCurrentPosition(
        (position) => {
          setLocation(position.coords.latitude, position.coords.longitude, position.coords.accuracy);
        },
        (error) => {
          updateGpsStatus(`GPS failed: ${error.message}`, 'error');
        },
        {
          enableHighAccuracy: true,
          timeout: 10000,
          maximumAge: 0
        }
      );
    }

    function matchesRegion(lat, lon, bounds) {
      return lat >= bounds.minLat && lat <= bounds.maxLat && lon >= bounds.minLon && lon <= bounds.maxLon;
    }

    function haversineKm(lat1, lon1, lat2, lon2) {
      const toRad = (value) => (value * Math.PI) / 180;
      const dLat = toRad(lat2 - lat1);
      const dLon = toRad(lon2 - lon1);
      const a =
        Math.sin(dLat / 2) ** 2 +
        Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) ** 2;
      return 2 * 6371 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    function pointInRing(point, ring) {
      let inside = false;
      for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
        const xi = ring[i][0];
        const yi = ring[i][1];
        const xj = ring[j][0];
        const yj = ring[j][1];
        const intersect = (yi > point[1]) !== (yj > point[1]) &&
          (point[0] < ((xj - xi) * (point[1] - yi)) / (yj - yi || 1) + xi);
        if (intersect) inside = !inside;
      }
      return inside;
    }

    function pointInPolygon(point, coordinates) {
      const rings = Array.isArray(coordinates[0][0]) ? coordinates : [coordinates];
      for (const ringSet of rings) {
        const outer = ringSet[0];
        const holes = ringSet.slice(1);
        if (!pointInRing(point, outer)) continue;
        const insideHole = holes.some((hole) => pointInRing(point, hole));
        if (!insideHole) return true;
      }
      return false;
    }

    async function loadCountyGeodata() {
      if (countyGeoJson) return countyGeoJson;
      const response = await fetch('https://raw.githubusercontent.com/plotly/datasets/master/geojson-counties-fips.json');
      const data = await response.json();
      countyGeoJson = data.features.filter((feature) => feature.properties.STATE === '13');
      return countyGeoJson;
    }

    function countyCentroid(feature) {
      const geometry = feature.geometry;
      if (!geometry || !geometry.coordinates) return null;

      let polygon = null;
      if (geometry.type === 'Polygon') {
        polygon = geometry.coordinates[0];
      } else if (geometry.type === 'MultiPolygon') {
        polygon = geometry.coordinates[0][0];
      }

      if (!polygon || !polygon.length) return null;

      const center = polygon.reduce((acc, current) => {
        acc[0] += current[0];
        acc[1] += current[1];
        return acc;
      }, [0, 0]);

      return {
        lat: center[1] / polygon.length,
        lon: center[0] / polygon.length
      };
    }

    function findCountyForPoint(lat, lon, accuracyMeters = 5000) {
      if (!countyGeoJson) return null;
      const point = [lon, lat];
      const accuracyKm = Math.max(1, accuracyMeters / 1000);
      const maxDistanceKm = Math.max(25, accuracyKm * 5);

      const exactMatches = countyGeoJson
        .filter((feature) => {
          const geometry = feature.geometry;
          if (!geometry) return false;
          if (geometry.type === 'Polygon') {
            return pointInPolygon(point, geometry.coordinates);
          }
          if (geometry.type === 'MultiPolygon') {
            return geometry.coordinates.some((polygon) => pointInPolygon(point, polygon));
          }
          return false;
        })
        .map((feature) => {
          const centroid = countyCentroid(feature);
          return {
            name: feature.properties.NAME,
            distance: centroid ? haversineKm(lat, lon, centroid.lat, centroid.lon) : Infinity
          };
        })
        .sort((a, b) => a.distance - b.distance)
        .map((item) => item.name);

      if (exactMatches.length > 0) {
        return exactMatches;
      }

      const nearbyMatches = countyGeoJson
        .map((feature) => {
          const centroid = countyCentroid(feature);
          if (!centroid) return null;
          return {
            name: feature.properties.NAME,
            distance: haversineKm(lat, lon, centroid.lat, centroid.lon)
          };
        })
        .filter((item) => item && item.distance <= maxDistanceKm)
        .sort((a, b) => a.distance - b.distance)
        .slice(0, 2)
        .map((item) => item.name);

      if (nearbyMatches.length > 0) {
        return nearbyMatches;
      }

      const nearest = countyGeoJson
        .map((feature) => {
          const centroid = countyCentroid(feature);
          if (!centroid) return null;
          return { name: feature.properties.NAME, distance: haversineKm(lat, lon, centroid.lat, centroid.lon) };
        })
        .filter(Boolean)
        .sort((a, b) => a.distance - b.distance)
        .slice(0, 2)
        .map((item) => item.name);

      return nearest;
    }

    function getSuggestedRegions(lat, lon, accuracyMeters = 5000) {
      const accuracyKm = Math.max(1, accuracyMeters / 1000);
      const exactCountyMatches = findCountyForPoint(lat, lon, accuracyMeters);

      if (exactCountyMatches && exactCountyMatches.length > 0) {
        const regionLabels = [...new Set(exactCountyMatches
          .map((county) => COUNTY_TO_REGION[county.toLowerCase()])
          .filter(Boolean)
          .map((slug) => REGION_LABELS[slug] || slug))];
        return regionLabels.slice(0, 2);
      }

      const fallback = Object.keys(REGION_BOUNDS)
        .map((slug) => ({ slug, label: REGION_LABELS[slug] || slug, distanceKm: haversineKm(lat, lon, REGION_CENTERS[slug].lat, REGION_CENTERS[slug].lon) }))
        .filter((entry) => entry.distanceKm <= Math.max(25, accuracyKm * 5))
        .sort((a, b) => a.distanceKm - b.distanceKm)
        .slice(0, 5)
        .map((entry) => entry.label);

      return [...new Set(fallback)];
    }

    function getSuggestedCategories(regionLabels) {
      const regionNames = new Set(regionLabels);
      const categories = [];
      for (const [category, slugs] of Object.entries(REGION_GROUPS)) {
        const categoryMatches = slugs.filter((slug) => {
          const label = REGION_LABELS[slug];
          return label && regionNames.has(label);
        });
        if (categoryMatches.length > 0) {
          categories.push(category);
        }
      }
      return categories;
    }

    function updateCountyOptions(countyNames) {
      const counties = [...new Set(countyNames || [])].filter(Boolean);
      if (!counties.length) {
        form.countySelect.innerHTML = '<option value="">No county match yet</option>';
        renderSuggestions([]);
        return;
      }

      const previousSelection = form.countySelect.value;
      form.countySelect.innerHTML = counties
        .map((county) => `<option value="${county}" ${county === previousSelection ? 'selected' : ''}>${county}</option>`)
        .join('');

      if (!form.countySelect.value) {
        form.countySelect.value = counties[0];
      }

      const selectedCounty = form.countySelect.value;
      const rows = counties.map((county) => {
        const slug = COUNTY_TO_REGION[county.toLowerCase()];
        const region = slug ? REGION_LABELS[slug] || slug : 'Unknown';
        const category = COUNTY_TO_CATEGORY[county.toLowerCase()] || 'Unassigned';
        return {
          county,
          region,
          category,
          selected: county === selectedCounty
        };
      });

      renderSuggestions(rows);
    }

    function renderSuggestions(rows) {
      form.suggestions.innerHTML = '';

      if (!rows.length) {
        form.suggestions.innerHTML = '<div class="chip">No clear fit</div>';
        return;
      }

      const table = document.createElement('table');
      table.className = 'suggestion-table';
      table.innerHTML = `
        <thead>
          <tr>
            <th>County</th>
            <th>Post region</th>
            <th>Category</th>
          </tr>
        </thead>
        <tbody></tbody>
      `;

      const tbody = table.querySelector('tbody');
      rows.forEach((row) => {
        const tr = document.createElement('tr');
        tr.classList.toggle('selected', Boolean(row.selected));
        tr.tabIndex = row.county && row.county !== '—' ? 0 : -1;
        tr.style.fontWeight = row.selected ? 700 : 400;
        tr.innerHTML = `
          <td>${row.county}</td>
          <td>${row.region}</td>
          <td>${row.category}</td>
        `;

        if (row.county && row.county !== '—') {
          tr.addEventListener('click', () => selectCountyOption(row.county));
          tr.addEventListener('keydown', (event) => {
            if (event.key === 'Enter' || event.key === ' ') {
              event.preventDefault();
              selectCountyOption(row.county);
            }
          });
        }

        tbody.appendChild(tr);
      });

      form.suggestions.appendChild(table);
    }

    function buildSuggestionRows(regionSuggestions, categorySuggestions) {
      const byRegion = new Map();
      for (const region of regionSuggestions) {
        byRegion.set(region, categorySuggestions.filter((category) => {
          const regionLabels = Object.entries(REGION_GROUPS)
            .filter(([name]) => name === category)
            .flatMap(([, slugs]) => slugs.map((slug) => REGION_LABELS[slug] || slug));
          return regionLabels.includes(region);
        }).join(', ') || '—');
      }

      return [...byRegion.entries()].map(([region, category]) => ({ region, category }));
    }

    async function updateSuggestedCountyMatches(location) {
      if (!location) {
        form.countySelect.innerHTML = '<option value="">No county match yet</option>';
        renderSuggestions([]);
        return;
      }

      await loadCountyGeodata();
      const accuracy = Number.isFinite(location.accuracy) ? location.accuracy : 5000;
      const counties = findCountyForPoint(location.lat, location.lon, accuracy) || [];
      updateCountyOptions(counties);
    }

    async function generateMessage() {
      const species = form.species.value.trim();
      const hotspot = form.hotspot.value.trim();
      const description = form.description.value.trim();
      const location = useManualCoordinates() || latestLocation;

      if (!species || !location) {
        updateGpsStatus('Enter the species and a valid GPS coordinate.', 'error');
        return;
      }

      try {
        await loadCountyGeodata();
      } catch (error) {
        updateGpsStatus('Could not load county boundaries. Falling back to a coarse match.', 'error');
      }

      const countySelection = form.countySelect.value;
      const countyNames = findCountyForPoint(location.lat, location.lon, Number.isFinite(location.accuracy) ? location.accuracy : 5000) || [];
      const selectedCounty = countySelection || countyNames[0] || '';
      const countySlug = COUNTY_TO_REGION[(selectedCounty || '').toLowerCase()];

      const regionSuggestions = selectedCounty && countySlug
        ? [REGION_LABELS[countySlug] || countySlug]
        : getSuggestedRegions(location.lat, location.lon, Number.isFinite(location.accuracy) ? location.accuracy : 5000);
      const categorySuggestions = selectedCounty
        ? [COUNTY_TO_CATEGORY[selectedCounty.toLowerCase()] || 'Unassigned']
        : getSuggestedCategories(regionSuggestions);
      const text = [
        `**Species:** ${species}`,
        hotspot ? `**Hotspot:** ${hotspot}` : '',
        `**GPS:** ${formatCoordinate(location.lat, 'lat')}, ${formatCoordinate(location.lon, 'lon')}${Number.isFinite(location.accuracy) ? ` (±${Math.round(location.accuracy)}m)` : ''}`,
        description ? `**Description:** ${description}` : ''
      ].filter(Boolean).join('\n');

      form.output.value = text;
      renderSuggestions(
        selectedCounty
          ? [{ county: selectedCounty, region: regionSuggestions[0], category: categorySuggestions[0] || '—', selected: true }]
          : buildSuggestionRows(regionSuggestions, categorySuggestions).map((row) => ({ county: '—', region: row.region, category: row.category, selected: true }))
      );
    }

    async function copyMessage() {
      const text = form.output.value.trim();
      if (!text) {
        updateGpsStatus('Generate a message before copying.', 'error');
        return;
      }

      try {
        await navigator.clipboard.writeText(text);
        updateGpsStatus('Discord message copied to clipboard.', 'success');
      } catch (error) {
        form.output.focus();
        form.output.select();
        document.execCommand('copy');
        updateGpsStatus('Manual copy used. Select the message and press Ctrl/Cmd + C.', 'success');
      }
    }

    document.getElementById('useLocationBtn').addEventListener('click', useMyGps);
    document.getElementById('manualCoordsBtn').addEventListener('click', useManualCoordinates);
    document.getElementById('generateBtn').addEventListener('click', generateMessage);
    document.getElementById('copyBtn').addEventListener('click', copyMessage);

    renderSuggestions([]);
  </script>
</body>
</html>
